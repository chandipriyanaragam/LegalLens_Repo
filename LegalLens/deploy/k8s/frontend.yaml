apiVersion: apps/v1
kind: Deployment
metadata:
  name: legallens-frontend
  namespace: legallens
  labels:
    app.kubernetes.io/name: legallens-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legallens-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legallens-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: legallensacs.azurecr.io/legallens-frontend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: legallens-frontend
  namespace: legallens
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: legallens-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
